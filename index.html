<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejemplos de validación</title>
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Ejemplos animados de validación de datos y una explicación animada de vectores.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Validaciones">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --acc:#60a5fa; --line:#334155; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; display:flex; flex-direction:column; }
  .solapas { flex:none; display:flex; gap:4px; padding:8px 12px 0; background:var(--card); border-bottom:1px solid var(--line); }
  .solapas button { font:inherit; font-weight:600; color:var(--mut); background:transparent; border:0; border-bottom:3px solid transparent; padding:10px 18px; cursor:pointer; transition:color .2s, border-color .2s; }
  .solapas button:hover { color:var(--txt); }
  .solapas button.on { color:var(--acc); border-bottom-color:var(--acc); }
  #contenido { flex:1; min-height:0; overflow:auto; position:relative; }
  .vista { display:none; min-height:100%; }
  .vista.activa { display:block; }
  #viewer.activa, #vectores.activa { display:flex; flex-direction:column; height:100%; }

  /* Portada */
  header.portada { text-align:center; padding:40px 16px 8px; }
  header.portada h1 { margin:0 0 8px; font-size:1.7rem; }
  header.portada p { margin:0; color:var(--mut); }
  .grid { max-width:920px; margin:24px auto 40px; padding:0 16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
  .tarjeta { text-align:left; font:inherit; color:inherit; background:var(--card); border:2px solid transparent; border-radius:16px; padding:20px; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:transform .2s, border-color .2s, box-shadow .2s; opacity:0; animation:entra .5s forwards; }
  .tarjeta:hover, .tarjeta:focus-visible { transform:translateY(-4px); border-color:var(--acc); box-shadow:0 10px 30px #0006; outline:none; }
  .tarjeta .num { font-size:.8rem; color:var(--acc); font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  .tarjeta .ico { font-size:2rem; }
  .tarjeta h2 { margin:0; font-size:1.1rem; }
  .tarjeta .regla { font-size:.9rem; color:var(--mut); }
  .tarjeta .regla b { color:var(--ok); font-weight:600; }
  @keyframes entra { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* Visor */
  .barra { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .barra button { font:inherit; color:var(--txt); background:#0f172a; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; transition:border-color .2s, opacity .2s; }
  .barra button:hover:not(:disabled) { border-color:var(--acc); }
  .barra button:disabled { opacity:.35; cursor:not-allowed; }
  .barra .titulo { flex:1; text-align:center; font-weight:700; min-width:140px; }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
</style>
</head>
<body>

<nav class="solapas" role="tablist">
  <button id="tab-ej" class="on" role="tab">Ejemplos</button>
  <button id="tab-vec" role="tab">Vectores</button>
</nav>

<main id="contenido">

<section class="vista activa" id="portada">
  <header class="portada">
    <h1>Ejemplos de validación</h1>
    <p>Elegí un ejemplo para probarlo</p>
  </header>
  <div class="grid" id="grid"></div>
</section>

<section class="vista" id="viewer">
  <div class="barra">
    <button id="volver">← Ejemplos</button>
    <button id="ant">‹ Anterior</button>
    <div class="titulo" id="titulo"></div>
    <button id="sig">Siguiente ›</button>
  </div>
  <iframe id="marco" title="Ejemplo"></iframe>
</section>

<section class="vista" id="vectores">
  <iframe id="marcoVec" title="Vectores"></iframe>
</section>

</main>

<script>
const EJEMPLOS = [{"n": 1, "icono": "➗", "titulo": "División por 0", "regla": "El segundo número no acepta 0", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ejemplo 1 · División por 0<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; }\n  .card { width:100%; max-width:520px; background:var(--card); border-radius:16px; padding:24px; box-shadow:0 10px 40px #0006; }\n  h1 { font-size:1.2rem; margin:0 0 16px; }\n  .step { opacity:.35; pointer-events:none; transition:opacity .5s, transform .5s; transform:translateY(8px); margin-bottom:16px; }\n  .step.active { opacity:1; pointer-events:auto; transform:none; }\n  .step.done { opacity:.7; transform:none; }\n  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }\n  input { width:100%; font-size:1.5rem; padding:10px 14px; border-radius:10px; border:2px solid #334155; background:#0f172a; color:var(--txt); outline:none; transition:border-color .2s; }\n  input:focus { border-color:var(--acc); }\n  input.error { border-color:var(--err); animation:shake .4s; }\n  input.valid { border-color:var(--ok); }\n  @keyframes shake { 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }\n  .msg { min-height:1.2em; font-size:.85rem; margin-top:6px; color:var(--mut); transition:color .2s; }\n  .msg.error { color:var(--err); }\n  button { width:100%; margin-top:10px; padding:12px; font-size:1rem; border:0; border-radius:10px; background:var(--acc); color:#0f172a; font-weight:700; cursor:pointer; transition:transform .1s, opacity .2s; }\n  button:active { transform:scale(.97); }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  #pizarra { font-family:ui-monospace,Consolas,monospace; font-size:1.3rem; line-height:1.6; background:#0f172a; border-radius:10px; padding:16px; min-height:140px; overflow-x:auto; white-space:pre; }\n  .linea { opacity:0; transform:translateY(-6px); animation:aparece .5s forwards; }\n  @keyframes aparece { to { opacity:1; transform:none; } }\n  .q { color:var(--ok); font-weight:700; }\n  .r { color:var(--acc); }\n  .resultado { margin-top:4px; font-size:1.8rem; text-align:center; opacity:0; transition:opacity .6s; }\n  .resultado.show { opacity:1; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h1>➗ Ejemplo 1 · División por 0<\/h1>\n\n  <div class=\"step active\" id=\"s1\">\n    <label for=\"a\">Ingrese el primer número<\/label>\n    <input id=\"a\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"Ej: 1234\">\n    <div class=\"msg\" id=\"m1\"><\/div>\n    <button id=\"b1\" disabled>Continuar<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s2\">\n    <label for=\"b\">Ingrese el segundo número<\/label>\n    <input id=\"b\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"Ej: 7\" disabled>\n    <div class=\"msg\" id=\"m2\"><\/div>\n    <button id=\"b2\" disabled>Dividir<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s3\">\n    <div class=\"resultado\" id=\"res\"><\/div>\n    <button id=\"reset\">Nueva división<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst a = $('a'), b = $('b'), m1 = $('m1'), m2 = $('m2');\nconst b1 = $('b1'), b2 = $('b2');\nconst patron = /^-?\\d*$/;\n\nfunction setStep(n) {\n  [1, 2, 3].forEach(i => {\n    const s = $('s' + i);\n    s.classList.toggle('active', i === n);\n    s.classList.toggle('done', i < n);\n  });\n}\n\nfunction rechazar(input, msg, texto) {\n  input.classList.remove('error'); void input.offsetWidth; // reinicia animación\n  input.classList.add('error');\n  msg.textContent = texto; msg.className = 'msg error';\n  setTimeout(() => input.classList.remove('error'), 450);\n}\n\n// Filtra caracteres inválidos y, en el divisor, impide que el valor sea 0\nfunction filtrar(input, msg, esDivisor) {\n  let prev = input.dataset.prev || '';\n  input.addEventListener('input', () => {\n    let v = input.value;\n    if (!patron.test(v)) {\n      input.value = prev;\n      return rechazar(input, msg, 'Solo se permiten números enteros.');\n    }\n    if (esDivisor && v !== '' && v !== '-' && Number(v) === 0) {\n      input.value = prev === '0' ? '' : prev;\n      prev = input.value;\n      b2.disabled = true;\n      return rechazar(input, msg, '🚫 No se puede dividir por cero');\n    }\n    prev = v; input.dataset.prev = v;\n    msg.textContent = ''; msg.className = 'msg';\n    const ok = v !== '' && v !== '-';\n    input.classList.toggle('valid', ok);\n    (esDivisor ? b2 : b1).disabled = !ok;\n  });\n}\nfiltrar(a, m1, false);\nfiltrar(b, m2, true);\n\nb1.onclick = () => {\n  setStep(2);\n  b.disabled = false; a.disabled = true; b.focus();\n};\na.addEventListener('keydown', e => { if (e.key === 'Enter' && !b1.disabled) b1.click(); });\nb.addEventListener('keydown', e => { if (e.key === 'Enter' && !b2.disabled) b2.click(); });\n\nb2.onclick = async () => {\n  const A = parseInt(a.value, 10), B = parseInt(b.value, 10);\n  if (B === 0) return rechazar(b, m2, '🚫 No se puede dividir por cero'); // doble seguridad\n  b.disabled = true; b2.disabled = true;\n  setStep(3);\n  await dividirAnimado(A, B);\n};\n\n// Formato argentino; muy chico o muy grande -> notación científica (nunca muestra 0 si no es 0)\nfunction formatear(r) {\n  if (r === 0) return '0';\n  const abs = Math.abs(r);\n  if (abs < 0.000001 || abs >= 1e15) {\n    const [m, e] = r.toExponential(4).split('e');\n    const mant = parseFloat(m).toLocaleString('es-AR', { maximumFractionDigits: 4 });\n    return mant + ' × 10<sup>' + parseInt(e, 10) + '<\/sup>';\n  }\n  return r.toLocaleString('es-AR', { maximumFractionDigits: 6 });\n}\n\nasync function dividirAnimado(A, B) {\n  const res = $('res');\n  res.classList.remove('show');\n  const r = A / B;\n  const txt = formatear(r);\n  res.innerHTML = `${A} ÷ ${B} = <b class=\"q\">${txt}<\/b>`;\n  await sleep(50);\n  res.classList.add('show');\n}\n\n$('reset').onclick = () => {\n  [a, b].forEach(i => { i.value = ''; i.dataset.prev = ''; i.classList.remove('valid', 'error'); });\n  a.disabled = false; b.disabled = true; b1.disabled = true; b2.disabled = true;\n  m1.textContent = m2.textContent = '';\n  setStep(1); a.focus();\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": 2, "icono": "🏷️", "titulo": "Precio del producto", "regla": "El precio no puede ser negativo", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Precio del producto<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; }\n  .card { width:100%; max-width:520px; background:var(--card); border-radius:16px; padding:24px; box-shadow:0 10px 40px #0006; }\n  h1 { font-size:1.2rem; margin:0 0 16px; }\n  .step { opacity:.35; pointer-events:none; transition:opacity .5s, transform .5s; transform:translateY(8px); margin-bottom:16px; }\n  .step.active { opacity:1; pointer-events:auto; transform:none; }\n  .step.done { opacity:.7; transform:none; }\n  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }\n  input { width:100%; font-size:1.5rem; padding:10px 14px; border-radius:10px; border:2px solid #334155; background:#0f172a; color:var(--txt); outline:none; transition:border-color .2s; }\n  input:focus { border-color:var(--acc); }\n  input.error { border-color:var(--err); animation:shake .4s; }\n  input.valid { border-color:var(--ok); }\n  @keyframes shake { 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }\n  .msg { min-height:1.2em; font-size:.85rem; margin-top:6px; color:var(--mut); transition:color .2s; }\n  .msg.error { color:var(--err); }\n  button { width:100%; margin-top:10px; padding:12px; font-size:1rem; border:0; border-radius:10px; background:var(--acc); color:#0f172a; font-weight:700; cursor:pointer; transition:transform .1s, opacity .2s; }\n  button:active { transform:scale(.97); }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  .resultado { margin-top:4px; font-size:1.8rem; text-align:center; opacity:0; transform:scale(.9); transition:opacity .6s, transform .6s; }\n  .resultado.show { opacity:1; transform:none; }\n  .q { color:var(--ok); font-weight:700; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h1>🏷️ Ejemplo 2 · Precio del producto<\/h1>\n\n  <div class=\"step active\" id=\"s1\">\n    <label for=\"p\">Ingrese el precio del producto<\/label>\n    <input id=\"p\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Ej: 1599,90\">\n    <div class=\"msg\" id=\"m1\"><\/div>\n    <button id=\"b1\" disabled>Confirmar precio<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s2\">\n    <div class=\"resultado\" id=\"res\"><\/div>\n    <button id=\"reset\">Ingresar otro precio<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst p = $('p'), m1 = $('m1'), b1 = $('b1');\nconst MSG = 'El precio no puede ser negativo. Ingrese un número válido.';\nconst patron = /^\\d*([.,]\\d{0,2})?$/; // solo dígitos y hasta 2 decimales (sin signo \"-\")\nlet prev = '';\n\nfunction setStep(n) {\n  [1, 2].forEach(i => {\n    const s = $('s' + i);\n    s.classList.toggle('active', i === n);\n    s.classList.toggle('done', i < n);\n  });\n}\n\nfunction rechazar(texto) {\n  p.classList.remove('error'); void p.offsetWidth; // reinicia la animación\n  p.classList.add('error');\n  m1.textContent = '🚫 ' + texto; m1.className = 'msg error';\n  setTimeout(() => p.classList.remove('error'), 450);\n}\n\np.addEventListener('input', () => {\n  const v = p.value;\n  if (!patron.test(v)) {      // negativos (\"-\"), letras, símbolos, más de 2 decimales\n    p.value = prev;\n    return rechazar(MSG);\n  }\n  prev = v;\n  m1.textContent = ''; m1.className = 'msg';\n  const num = parseFloat(v.replace(',', '.'));\n  const ok = !isNaN(num);\n  p.classList.toggle('valid', ok);\n  b1.disabled = !ok;\n});\n\np.addEventListener('keydown', e => { if (e.key === 'Enter' && !b1.disabled) b1.click(); });\n\nb1.onclick = async () => {\n  const num = parseFloat(p.value.replace(',', '.'));\n  if (isNaN(num) || num < 0) return rechazar(MSG); // doble seguridad\n  p.disabled = true; b1.disabled = true;\n  setStep(2);\n  const res = $('res');\n  res.classList.remove('show');\n  res.innerHTML = `Precio: <span class=\"q\">${num.toLocaleString('es-AR', { style:'currency', currency:'ARS' })}<\/span>`;\n  await new Promise(r => setTimeout(r, 50));\n  res.classList.add('show');\n};\n\n$('reset').onclick = () => {\n  p.value = ''; prev = ''; p.disabled = false;\n  p.classList.remove('valid', 'error');\n  m1.textContent = ''; m1.className = 'msg';\n  b1.disabled = true;\n  setStep(1); p.focus();\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": 3, "icono": "📝", "titulo": "Nota del 1 al 10", "regla": "Solo notas enteras entre 1 y 10", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ejemplo 3 · Nota del 1 al 10<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; -color:var(--r); }\n  .kbox b { color:var(--r); min-width:3.2em; display:inline-block; font-family:ui-monospace,Consolas,monospace; }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"lienzo\" id=\"caja\"><canvas id=\"cv\"><\/canvas><\/div>\n\n  <div class=\"panel\">\n    <h2 id=\"stitulo\"><\/h2>\n    <p id=\"stexto\"><\/p>\n    <div class=\"info\" id=\"sinfo\"><\/div>\n  <\/div>\n\n  <div class=\"kbox\" id=\"kbox\">\n    <span>Escalar<\/span>\n    <input type=\"range\" id=\"k\" min=\"-2\" max=\"2\" step=\"0.5\" value=\"1\">\n    <b id=\"kv\">k = 1<\/b>\n  <\/div>\n\n  <div class=\"ctrl\">\n    <button id=\"ant\" aria-label=\"Escena anterior\">‹ Anterior<\/button>\n    <button id=\"play\">⏸ Pausar<\/button>\n    <button id=\"sig\" aria-label=\"Escena siguiente\">Siguiente ›<\/button>\n    <button id=\"reset\">↺ Reiniciar<\/button>\n    <div class=\"dots\" id=\"dots\"><\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst cv = $('cv'), ctx = cv.getContext('2d'), caja = $('caja');\nconst C = { a:'#60a5fa', b:'#34d399', r:'#fbbf24', x:'#f472b6', grid:'#273449', eje:'#64748b', txt:'#e2e8f0', mut:'#94a3b8' };\n\n/* ---------- Estado ---------- */\nconst A0 = { x:3, y:2 }, B0 = { x:1, y:2 };\nlet A = { ...A0 }, B = { ...B0 };\nlet esc = 0, t0 = performance.now(), autoplay = true, holdIni = null, tocado = false, userK = null;\n\n/* ---------- Utilidades ---------- */\nconst clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));\nconst ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;\nconst fmt = n => n.toLocaleString('es-AR', { maximumFractionDigits: 2 });\nconst sg = n => n < 0 ? '(' + fmt(n) + ')' : fmt(n);\n\nlet W = 0, H = 0, u = 30, ox = 0, oy = 0;\nconst X = x => ox + x * u, Y = y => oy - y * u;\n\nfunction resize() {\n  const r = caja.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;\n  W = r.width; H = r.height;\n  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n  cv.style.width = W + 'px'; cv.style.height = H + 'px';\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  u = Math.max(12, Math.min(W / 13, H / 10));\n  ox = W / 2; oy = H / 2;\n}\nnew ResizeObserver(resize).observe(caja);\nwindow.addEventListener('resize', resize);\n\n/* ---------- Dibujo ---------- */\nfunction linea(x0, y0, x1, y1, col, w, dash) {\n  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(y0)); ctx.lineTo(X(x1), Y(y1)); ctx.stroke(); ctx.restore();\n}\n\nfunction flecha(x0, y0, x1, y1, col, w = 3.5, dash) {\n  const p0x = X(x0), p0y = Y(y0), p1x = X(x1), p1y = Y(y1);\n  const pl = Math.hypot(p1x - p0x, p1y - p0y);\n  if (pl < 2) return;\n  const ang = Math.atan2(p1y - p0y, p1x - p0x), hl = Math.min(14, pl * .6);\n  ctx.save();\n  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';\n  ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(p0x, p0y);\n  ctx.lineTo(p1x - Math.cos(ang) * hl * .7, p1y - Math.sin(ang) * hl * .7); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(p1x, p1y);\n  ctx.lineTo(p1x - hl * Math.cos(ang - .42), p1y - hl * Math.sin(ang - .42));\n  ctx.lineTo(p1x - hl * Math.cos(ang + .42), p1y - hl * Math.sin(ang + .42));\n  ctx.closePath(); ctx.fill(); ctx.restore();\n}\n\nfunction texto(s, px, py, col, size = 14, align = 'center', bold = true) {\n  ctx.save(); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';\n  ctx.font = (bold ? '700 ' : '400 ') + size + 'px system-ui, sans-serif';\n  ctx.fillText(s, px, py); ctx.restore();\n}\n\nfunction grilla() {\n  const nx = Math.ceil(W / 2 / u), ny = Math.ceil(H / 2 / u);\n  ctx.save(); ctx.lineWidth = 1;\n  for (let i = -nx; i <= nx; i++) { ctx.strokeStyle = i === 0 ? C.eje : C.grid; ctx.beginPath(); ctx.moveTo(X(i), 0); ctx.lineTo(X(i), H); ctx.stroke(); }\n  for (let j = -ny; j <= ny; j++) { ctx.strokeStyle = j === 0 ? C.eje : C.grid; ctx.beginPath(); ctx.moveTo(0, Y(j)); ctx.lineTo(W, Y(j)); ctx.stroke(); }\n  ctx.restore();\n  const paso = u >= 24 ? 1 : 2;\n  for (let i = -nx; i <= nx; i++) if (i !== 0 && i % paso === 0 && X(i) > 16 && X(i) < W - 16) texto(i, X(i), Y(0) + 12, C.mut, 11, 'center', false);\n  for (let j = -ny; j <= ny; j++) if (j !== 0 && j % paso === 0 && Y(j) > 16 && Y(j) < H - 16) texto(j, X(0) - 12, Y(j), C.mut, 11, 'center', false);\n  texto('x', W - 12, Y(0) - 12, C.mut, 13); texto('y', X(0) + 12, 12, C.mut, 13);\n}\n\nfunction manija(x, y, col, pulso) {\n  ctx.save();\n  if (pulso) {\n    const ph = (performance.now() % 1400) / 1400;\n    ctx.globalAlpha = (1 - ph) * .7; ctx.strokeStyle = col; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.arc(X(x), Y(y), 10 + ph * 16, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;\n  }\n  ctx.fillStyle = '#0f172a'; ctx.strokeStyle = col; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 8, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();\n}\n\n/* ---------- Escenas ---------- */\nconst K_CLAVES = [[0, 1], [.25, 2], [.5, .5], [.75, -1], [1, 1]];\nfunction kEn(p) {\n  for (let i = 1; i < K_CLAVES.length; i++) {\n    if (p <= K_CLAVES[i][0]) {\n      const [p0, k0] = K_CLAVES[i - 1], [p1, k1] = K_CLAVES[i];\n      return k0 + (k1 - k0) * ease((p - p0) / (p1 - p0));\n    }\n  }\n  return 1;\n}\nconst kActual = p => userK !== null ? userK : kEn(p);\nconst mod = v => Math.hypot(v.x, v.y);\n\nfunction filaArreglo(nombre, vals, py, cs, p, col, expr) {\n  const total = 96 + cs * 2 + 8, x0 = (W - total) / 2 + 96;\n  ctx.save(); ctx.globalAlpha = clamp(p);\n  texto(nombre, x0 - 14, py, col, 16, 'right');\n  vals.forEach((v, i) => {\n    const cx = x0 + i * (cs + 8);\n    ctx.fillStyle = '#0f172a'; ctx.strokeStyle = col; ctx.lineWidth = 2.5;\n    ctx.beginPath(); ctx.roundRect(cx, py - cs / 2, cs, cs, 10); ctx.fill(); ctx.stroke();\n    texto(fmt(v), cx + cs / 2, py, C.txt, Math.min(26, cs * .45));\n    if (expr) texto(expr[i], cx + cs / 2, py + cs / 2 + 11, C.mut, 11, 'center', false);\n  });\n  ctx.restore();\n}\n\nconst ESCENAS = [\n  { // 0 · Qué es un vector\n    titulo: '1 · ¿Qué es un vector?', dur: 3200, manijas: ['A'],\n    texto: 'Un vector es una <b>flecha<\/b>. Tiene <b>módulo<\/b> (su largo), <b>dirección<\/b> (la recta donde está) y <b>sentido<\/b> (hacia dónde apunta). Nace en la <b>cola<\/b> y termina en la <b>punta<\/b>.',\n    info: () => `v = (${fmt(A.x)}, ${fmt(A.y)})  <small>→ ${fmt(A.x)} en x y ${fmt(A.y)} en y<\/small>`,\n    dibujar(p) {\n      const e = ease(clamp(p / .6)), m = mod(A);\n      if (m > 0) {\n        const f = clamp((p - .55) / .35), dx = A.x / m * 30, dy = A.y / m * 30;\n        ctx.globalAlpha = f * .8; linea(-dx, -dy, dx, dy, C.mut, 1.5, [6, 6]); ctx.globalAlpha = 1;\n        if (f > .2) texto('dirección', X(A.x / m * 5.2) + 4, Y(A.y / m * 5.2) - 14, C.mut, 12, 'center', false);\n      }\n      flecha(0, 0, A.x * e, A.y * e, C.a);\n      if (p > .35) {\n        ctx.globalAlpha = clamp((p - .35) / .2);\n        texto('cola', X(0) - 6, Y(0) + 18, C.txt, 12, 'right');\n        ctx.globalAlpha = clamp((p - .75) / .2);\n        texto('punta', X(A.x) + 14, Y(A.y) - 16, C.txt, 12, 'left');\n        texto('v', X(A.x / 2) - 12, Y(A.y / 2) - 12, C.a, 18);\n        ctx.globalAlpha = 1;\n      }\n    }\n  },\n  { // 1 · Componentes\n    titulo: '2 · Componentes, módulo y ángulo', dur: 5200, manijas: ['A'],\n    texto: 'Todo vector se descompone en un desplazamiento <b>horizontal<\/b> y otro <b>vertical<\/b>. El módulo sale del teorema de Pitágoras y el ángulo mide hacia dónde apunta.',\n    info: () => {\n      const m = mod(A), ang = Math.atan2(A.y, A.x) * 180 / Math.PI;\n      return `|v| = √(${fmt(A.x)}² + ${fmt(A.y)}²) = ${fmt(m)}<br>θ = ${fmt(ang)}°`;\n    },\n    dibujar(p) {\n      const h = ease(clamp(p / .35)), v = ease(clamp((p - .35) / .35)), r = clamp((p - .75) / .25);\n      flecha(0, 0, A.x, A.y, C.a);\n      flecha(0, 0, A.x * h, 0, C.x, 3, [7, 5]);\n      if (p > .3) { ctx.globalAlpha = clamp((p - .3) / .15); texto('x = ' + fmt(A.x), X(A.x / 2), Y(0) + (A.y >= 0 ? 20 : -20), C.x, 14); ctx.globalAlpha = 1; }\n      if (p > .35) flecha(A.x, 0, A.x, A.y * v, C.b, 3, [7, 5]);\n      if (p > .65) { ctx.globalAlpha = clamp((p - .65) / .15); texto('y = ' + fmt(A.y), X(A.x) + (A.x >= 0 ? 34 : -34), Y(A.y / 2), C.b, 14); ctx.globalAlpha = 1; }\n      if (r > 0 && mod(A) > 0) {\n        ctx.save(); ctx.globalAlpha = r;\n        const th = Math.atan2(A.y, A.x);\n        ctx.strokeStyle = C.r; ctx.lineWidth = 2.5;\n        ctx.beginPath(); ctx.arc(X(0), Y(0), 30, 0, -th * r, th > 0); ctx.stroke();\n        texto('θ', X(0) + 44 * Math.cos(th / 2), Y(0) - 44 * Math.sin(th / 2), C.r, 15);\n        texto('|v|', X(A.x / 2) - 16 * Math.sign(A.y || 1), Y(A.y / 2) - 16 * Math.sign(A.x || 1), C.a, 16);\n        ctx.restore();\n      }\n    }\n  },\n  { // 2 · Suma\n    titulo: '3 · Suma de vectores', dur: 5600, manijas: ['A', 'B'],\n    texto: 'Para sumar, ponés la <b>cola de b en la punta de a<\/b>. El vector que va desde el inicio de a hasta la punta de b es <b>a + b<\/b>. Se suma componente a componente.',\n    info: () => `a + b = (${fmt(A.x)} + ${sg(B.x)}, ${fmt(A.y)} + ${sg(B.y)}) = (${fmt(A.x + B.x)}, ${fmt(A.y + B.y)})`,\n    dibujar(p) {\n      const s = { x: A.x + B.x, y: A.y + B.y };\n      const m = ease(clamp(p / .45)), r = ease(clamp((p - .5) / .4)), par = clamp((p - .9) / .1);\n      flecha(0, 0, A.x, A.y, C.a);\n      texto('a', X(A.x / 2) - 12, Y(A.y / 2) + 12, C.a, 18);\n      if (m < 1) { ctx.globalAlpha = (1 - m) * .5; flecha(0, 0, B.x, B.y, C.b, 2.5, [5, 5]); ctx.globalAlpha = 1; }\n      const bx = A.x * m, by = A.y * m;\n      flecha(bx, by, bx + B.x, by + B.y, C.b);\n      if (p > .2) { ctx.globalAlpha = clamp((p - .2) / .2); texto('b', X(bx + B.x / 2) + 14, Y(by + B.y / 2) - 8, C.b, 18); ctx.globalAlpha = 1; }\n      if (par > 0) { ctx.globalAlpha = par * .6; linea(B.x, B.y, s.x, s.y, C.a, 1.5, [5, 5]); linea(0, 0, B.x, B.y, C.b, 1.5, [5, 5]); ctx.globalAlpha = 1; }\n      if (r > 0) {\n        flecha(0, 0, s.x * r, s.y * r, C.r, 4.5);\n        if (r > .9) { const L = Math.hypot(s.x, s.y) || 1; texto('a + b', X(s.x / 2) + s.y / L * 34, Y(s.y / 2) + s.x / L * 34, C.r, 16); }\n      }\n    }\n  },\n  { // 3 · Escalar\n    titulo: '4 · Multiplicar por un número', dur: 9000, manijas: ['A'],\n    texto: 'Un número <b>k<\/b> (escalar) <b>estira o encoge<\/b> el vector. Si k es <b>negativo<\/b>, además invierte el sentido. Movés el deslizador para probarlo.',\n    info: p => {\n      const k = kActual(p);\n      return `k · a = (${fmt(k)}·${sg(A.x)}, ${fmt(k)}·${sg(A.y)}) = (${fmt(k * A.x)}, ${fmt(k * A.y)})`;\n    },\n    infoK: true,\n    dibujar(p) {\n      const k = kActual(p);\n      ctx.globalAlpha = .55; flecha(0, 0, A.x, A.y, C.a, 2.5, [6, 5]); ctx.globalAlpha = 1;\n      flecha(0, 0, A.x * k, A.y * k, C.r, 4.5);\n      texto('a', X(A.x) + 12, Y(A.y) - 12, C.a, 16);\n      if (Math.abs(k) > .01) texto('k·a', X(A.x * k) + (k >= 0 ? 16 : -16), Y(A.y * k) + (k >= 0 ? -14 : 14), C.r, 16);\n      texto('k = ' + fmt(k), 16, 20, C.r, 16, 'left');\n    }\n  },\n  { // 4 · En programación\n    titulo: '5 · Vectores en programación', dur: 5200, manijas: [], sinGrilla: true,\n    texto: 'En un programa, un vector es un <b>arreglo de números<\/b>: una posición por componente. Sumar vectores es sumar <b>posición por posición<\/b>.',\n    info: () => `r = [ a[0]+b[0], a[1]+b[1] ] = [ ${fmt(A.x + B.x)}, ${fmt(A.y + B.y)} ]`,\n    dibujar(p) {\n      const gap = Math.min(96, H / 4.2), cs = Math.max(34, Math.min(66, gap * .7, W / 7));\n      const y1 = H / 2 - gap, y2 = H / 2, y3 = H / 2 + gap;\n      const total = 96 + cs * 2 + 8, x0 = (W - total) / 2 + 96;\n      ['x', 'y'].forEach((n, i) => texto('[' + i + ']  ' + n, x0 + i * (cs + 8) + cs / 2, y1 - cs / 2 - 14, C.mut, 12, 'center', false));\n      filaArreglo('a =', [A.x, A.y], y1, cs, p / .2, C.a);\n      filaArreglo('b =', [B.x, B.y], y2, cs, (p - .2) / .2, C.b);\n      const c0 = clamp((p - .55) / .15), c1 = clamp((p - .72) / .15);\n      if (c0 > 0) filaArreglo('a + b =', [A.x + B.x], y3, cs, c0, C.r, [fmt(A.x) + ' + ' + sg(B.x)]);\n      if (c1 > 0) {\n        const cx = x0 + (cs + 8), f = clamp(c1);\n        ctx.save(); ctx.globalAlpha = f;\n        ctx.fillStyle = '#0f172a'; ctx.strokeStyle = C.r; ctx.lineWidth = 2.5;\n        ctx.beginPath(); ctx.roundRect(cx, y3 - cs / 2, cs, cs, 10); ctx.fill(); ctx.stroke();\n        texto(fmt(A.y + B.y), cx + cs / 2, y3, C.txt, Math.min(26, cs * .45));\n        texto(fmt(A.y) + ' + ' + sg(B.y), cx + cs / 2, y3 + cs / 2 + 11, C.mut, 11, 'center', false);\n        ctx.restore();\n      }\n      if (p > .9) { ctx.globalAlpha = clamp((p - .9) / .1); texto('r = [ a[0]+b[0], a[1]+b[1] ]', W / 2, Math.min(H - 16, y3 + cs / 2 + 36), C.r, 14, 'center', true); ctx.globalAlpha = 1; }\n    }\n  }\n];\nconst N = ESCENAS.length;\n\n/* ---------- Interfaz ---------- */\nconst dots = $('dots');\nESCENAS.forEach((_, i) => {\n  const b = document.createElement('button');\n  b.setAttribute('aria-label', 'Ir a la escena ' + (i + 1));\n  b.onclick = () => irA(i);\n  dots.appendChild(b);\n});\n\nlet ultInfo = '';\nfunction actualizarUI() {\n  const s = ESCENAS[esc];\n  $('stitulo').textContent = s.titulo;\n  $('stexto').innerHTML = s.texto + (s.manijas.length ? ' <b>Arrastrá la punta de las flechas<\/b> para cambiar los valores.' : '');\n  $('kbox').classList.toggle('on', !!s.infoK);\n  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === esc));\n  $('play').textContent = autoplay ? '⏸ Pausar' : '▶ Reproducir';\n  ultInfo = '';\n}\n\nfunction irA(i) {\n  esc = (i + N) % N; t0 = performance.now(); holdIni = null; tocado = false; userK = null;\n  $('k').value = 1; actualizarUI();\n}\n\n$('ant').onclick = () => { autoplay = false; irA(esc - 1); };\n$('sig').onclick = () => { autoplay = false; irA(esc + 1); };\n$('play').onclick = () => {\n  autoplay = !autoplay; holdIni = null;\n  if (autoplay && tocado) { tocado = false; t0 = performance.now(); }\n  actualizarUI();\n};\n$('reset').onclick = () => { A = { ...A0 }; B = { ...B0 }; autoplay = true; irA(esc); };\n$('k').oninput = e => { userK = parseFloat(e.target.value); autoplay = false; tocado = true; actualizarUI(); };\n\n/* ---------- Arrastrar puntas ---------- */\nlet arrastre = null;\nconst posManija = id => id === 'A' ? { x: A.x, y: A.y } : { x: A.x + B.x, y: A.y + B.y };\n\nfunction ptr(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }\n\ncv.addEventListener('pointerdown', e => {\n  const q = ptr(e); let mejor = null, d = 30;\n  ESCENAS[esc].manijas.forEach(id => {\n    const m = posManija(id), dd = Math.hypot(X(m.x) - q.x, Y(m.y) - q.y);\n    if (dd < d) { d = dd; mejor = id; }\n  });\n  if (mejor) { arrastre = mejor; cv.setPointerCapture(e.pointerId); autoplay = false; tocado = true; actualizarUI(); }\n});\ncv.addEventListener('pointermove', e => {\n  const q = ptr(e);\n  if (!arrastre) {\n    const hay = ESCENAS[esc].manijas.some(id => { const m = posManija(id); return Math.hypot(X(m.x) - q.x, Y(m.y) - q.y) < 30; });\n    cv.style.cursor = hay ? 'grab' : 'default'; return;\n  }\n  const mx = Math.round((q.x - ox) / u), my = Math.round((oy - q.y) / u);\n  if (arrastre === 'A') { A.x = clamp(mx, -3, 3); A.y = clamp(my, -2, 2); }\n  else { B.x = clamp(mx - A.x, -3, 3); B.y = clamp(my - A.y, -2, 2); }\n});\nconst soltar = () => { arrastre = null; };\ncv.addEventListener('pointerup', soltar);\ncv.addEventListener('pointercancel', soltar);\n\n/* ---------- Bucle ---------- */\nfunction bucle(now) {\n  const s = ESCENAS[esc];\n  let p = tocado ? 1 : clamp((now - t0) / s.dur);\n  if (autoplay && p >= 1) {\n    if (holdIni === null) holdIni = now;\n    if (now - holdIni > 3200) irA(esc + 1);\n  }\n  ctx.clearRect(0, 0, W, H);\n  if (!s.sinGrilla) grilla();\n  s.dibujar(p);\n  if (p >= 1 || tocado) s.manijas.forEach(id => { const m = posManija(id); manija(m.x, m.y, id === 'A' ? C.a : C.b, !tocado); });\n\n  const info = s.info(p);\n  if (info !== ultInfo) { $('sinfo').innerHTML = info; ultInfo = info; }\n  if (s.infoK) {\n    const k = kActual(p), txt = 'k = ' + fmt(k);\n    if ($('kv').textContent !== txt) $('kv').textContent = txt;\n    if (userK === null) $('k').value = Math.round(clamp(k, -2, 2) * 2) / 2;\n  }\n  requestAnimationFrame(bucle);\n}\n\nresize();\nactualizarUI();\nrequestAnimationFrame(bucle);\n<\/script>\n<\/body>\n<\/html>\n";

const $ = id => document.getElementById(id);
let actual = 0;

// Portada: tarjetas
EJEMPLOS.forEach((e, i) => {
  const b = document.createElement('button');
  b.className = 'tarjeta';
  b.style.animationDelay = (i * 70) + 'ms';
  b.innerHTML = '<span class="num">Ejemplo ' + e.n + '</span><span class="ico">' + e.icono + '</span>' +
                '<h2></h2><span class="regla"></span>';
  b.querySelector('h2').textContent = e.titulo;
  b.querySelector('.regla').textContent = e.regla;
  b.onclick = () => abrir(i);
  $('grid').appendChild(b);
});

function mostrar(id) {
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === id));
  $('tab-ej').classList.toggle('on', id !== 'vectores');
  $('tab-vec').classList.toggle('on', id === 'vectores');
}

let ultimaEj = 'portada'; // a qué pantalla volver al regresar a la solapa Ejemplos

function irEjemplos() {
  $('marcoVec').srcdoc = '';
  if (ultimaEj === 'viewer') abrir(actual); else mostrar('portada');
  if (ultimaEj !== 'viewer') { try { history.replaceState(null, '', location.pathname); } catch (_) {} }
}

function irVectores() {
  $('marco').srcdoc = '';
  $('marcoVec').srcdoc = VECTORES; // se recarga: la animación arranca desde el principio
  mostrar('vectores');
  try { history.replaceState(null, '', '#vectores'); } catch (_) {}
}

$('tab-ej').onclick = irEjemplos;
$('tab-vec').onclick = irVectores;

function abrir(i) {
  actual = i;
  const e = EJEMPLOS[i];
  $('marco').srcdoc = e.html;
  $('titulo').textContent = 'Ejemplo ' + e.n + ' · ' + e.titulo;
  $('ant').disabled = i === 0;
  $('sig').disabled = i === EJEMPLOS.length - 1;
  mostrar('viewer');
  ultimaEj = 'viewer';
  try { history.replaceState(null, '', '#ejemplo-' + e.n); } catch (_) {}
}

$('volver').onclick = () => {
  $('marco').srcdoc = '';
  ultimaEj = 'portada';
  mostrar('portada');
  try { history.replaceState(null, '', location.pathname); } catch (_) {}
};
$('ant').onclick = () => { if (actual > 0) abrir(actual - 1); };
$('sig').onclick = () => { if (actual < EJEMPLOS.length - 1) abrir(actual + 1); };

// PWA: registra el service worker (requiere https o localhost)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Abre directo si la URL trae #ejemplo-N o #vectores
const m = /^#ejemplo-(\d+)$/.exec(location.hash);
if (m && EJEMPLOS[m[1] - 1]) abrir(m[1] - 1);
else if (location.hash === '#vectores') irVectores();
</script>

</html>
