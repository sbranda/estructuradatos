<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejemplos de validación</title>
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Ejemplos animados de validación de datos y una explicación animada de vectores.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Validaciones">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --acc:#60a5fa; --line:#334155; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; display:flex; flex-direction:column; }
  .solapas { flex:none; display:flex; gap:4px; padding:8px 12px 0; background:var(--card); border-bottom:1px solid var(--line); }
  .solapas button { font:inherit; font-weight:600; color:var(--mut); background:transparent; border:0; border-bottom:3px solid transparent; padding:10px 18px; cursor:pointer; transition:color .2s, border-color .2s; }
  .solapas button:hover { color:var(--txt); }
  .solapas button.on { color:var(--acc); border-bottom-color:var(--acc); }
  #contenido { flex:1; min-height:0; overflow:auto; position:relative; }
  .vista { display:none; min-height:100%; }
  .vista.activa { display:block; }
  #viewer.activa, #vectores.activa { display:flex; flex-direction:column; height:100%; }

  /* Portada */
  header.portada { text-align:center; padding:40px 16px 8px; }
  header.portada h1 { margin:0 0 8px; font-size:1.7rem; }
  header.portada p { margin:0; color:var(--mut); }
  .grid { max-width:920px; margin:24px auto 40px; padding:0 16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
  .tarjeta { text-align:left; font:inherit; color:inherit; background:var(--card); border:2px solid transparent; border-radius:16px; padding:20px; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:transform .2s, border-color .2s, box-shadow .2s; opacity:0; animation:entra .5s forwards; }
  .tarjeta:hover, .tarjeta:focus-visible { transform:translateY(-4px); border-color:var(--acc); box-shadow:0 10px 30px #0006; outline:none; }
  .tarjeta .num { font-size:.8rem; color:var(--acc); font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  .tarjeta .ico { font-size:2rem; }
  .tarjeta h2 { margin:0; font-size:1.1rem; }
  .tarjeta .regla { font-size:.9rem; color:var(--mut); }
  .tarjeta .regla b { color:var(--ok); font-weight:600; }
  @keyframes entra { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* Visor */
  .barra { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .barra button { font:inherit; color:var(--txt); background:#0f172a; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; transition:border-color .2s, opacity .2s; }
  .barra button:hover:not(:disabled) { border-color:var(--acc); }
  .barra button:disabled { opacity:.35; cursor:not-allowed; }
  .barra .titulo { flex:1; text-align:center; font-weight:700; min-width:140px; }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
</style>
</head>
<body>

<nav class="solapas" role="tablist">
  <button id="tab-ej" class="on" role="tab">Ejemplos</button>
  <button id="tab-vec" role="tab">Vectores</button>
</nav>

<main id="contenido">

<section class="vista activa" id="portada">
  <header class="portada">
    <h1>Ejemplos de validación</h1>
    <p>Elegí un ejemplo para probarlo</p>
  </header>
  <div class="grid" id="grid"></div>
</section>

<section class="vista" id="viewer">
  <div class="barra">
    <button id="volver">← Ejemplos</button>
    <button id="ant">‹ Anterior</button>
    <div class="titulo" id="titulo"></div>
    <button id="sig">Siguiente ›</button>
  </div>
  <iframe id="marco" title="Ejemplo"></iframe>
</section>

<section class="vista" id="vectores">
  <iframe id="marcoVec" title="Vectores"></iframe>
</section>

</main>

<script>
const EJEMPLOS = [{"n": 1, "icono": "➗", "titulo": "División por 0", "regla": "El segundo número no acepta 0", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ejemplo 1 · División por 0<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; }\n  .card { width:100%; max-width:520px; background:var(--card); border-radius:16px; padding:24px; box-shadow:0 10px 40px #0006; }\n  h1 { font-size:1.2rem; margin:0 0 16px; }\n  .step { opacity:.35; pointer-events:none; transition:opacity .5s, transform .5s; transform:translateY(8px); margin-bottom:16px; }\n  .step.active { opacity:1; pointer-events:auto; transform:none; }\n  .step.done { opacity:.7; transform:none; }\n  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }\n  input { width:100%; font-size:1.5rem; padding:10px 14px; border-radius:10px; border:2px solid #334155; background:#0f172a; color:var(--txt); outline:none; transition:border-color .2s; }\n  input:focus { border-color:var(--acc); }\n  input.error { border-color:var(--err); animation:shake .4s; }\n  input.valid { border-color:var(--ok); }\n  @keyframes shake { 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }\n  .msg { min-height:1.2em; font-size:.85rem; margin-top:6px; color:var(--mut); transition:color .2s; }\n  .msg.error { color:var(--err); }\n  button { width:100%; margin-top:10px; padding:12px; font-size:1rem; border:0; border-radius:10px; background:var(--acc); color:#0f172a; font-weight:700; cursor:pointer; transition:transform .1s, opacity .2s; }\n  button:active { transform:scale(.97); }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  #pizarra { font-family:ui-monospace,Consolas,monospace; font-size:1.3rem; line-height:1.6; background:#0f172a; border-radius:10px; padding:16px; min-height:140px; overflow-x:auto; white-space:pre; }\n  .linea { opacity:0; transform:translateY(-6px); animation:aparece .5s forwards; }\n  @keyframes aparece { to { opacity:1; transform:none; } }\n  .q { color:var(--ok); font-weight:700; }\n  .r { color:var(--acc); }\n  .resultado { margin-top:4px; font-size:1.8rem; text-align:center; opacity:0; transition:opacity .6s; }\n  .resultado.show { opacity:1; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h1>➗ Ejemplo 1 · División por 0<\/h1>\n\n  <div class=\"step active\" id=\"s1\">\n    <label for=\"a\">Ingrese el primer número<\/label>\n    <input id=\"a\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"Ej: 1234\">\n    <div class=\"msg\" id=\"m1\"><\/div>\n    <button id=\"b1\" disabled>Continuar<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s2\">\n    <label for=\"b\">Ingrese el segundo número<\/label>\n    <input id=\"b\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"Ej: 7\" disabled>\n    <div class=\"msg\" id=\"m2\"><\/div>\n    <button id=\"b2\" disabled>Dividir<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s3\">\n    <div class=\"resultado\" id=\"res\"><\/div>\n    <button id=\"reset\">Nueva división<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst a = $('a'), b = $('b'), m1 = $('m1'), m2 = $('m2');\nconst b1 = $('b1'), b2 = $('b2');\nconst patron = /^-?\\d*$/;\n\nfunction setStep(n) {\n  [1, 2, 3].forEach(i => {\n    const s = $('s' + i);\n    s.classList.toggle('active', i === n);\n    s.classList.toggle('done', i < n);\n  });\n}\n\nfunction rechazar(input, msg, texto) {\n  input.classList.remove('error'); void input.offsetWidth; // reinicia animación\n  input.classList.add('error');\n  msg.textContent = texto; msg.className = 'msg error';\n  setTimeout(() => input.classList.remove('error'), 450);\n}\n\n// Filtra caracteres inválidos y, en el divisor, impide que el valor sea 0\nfunction filtrar(input, msg, esDivisor) {\n  let prev = input.dataset.prev || '';\n  input.addEventListener('input', () => {\n    let v = input.value;\n    if (!patron.test(v)) {\n      input.value = prev;\n      return rechazar(input, msg, 'Solo se permiten números enteros.');\n    }\n    if (esDivisor && v !== '' && v !== '-' && Number(v) === 0) {\n      input.value = prev === '0' ? '' : prev;\n      prev = input.value;\n      b2.disabled = true;\n      return rechazar(input, msg, '🚫 No se puede dividir por cero');\n    }\n    prev = v; input.dataset.prev = v;\n    msg.textContent = ''; msg.className = 'msg';\n    const ok = v !== '' && v !== '-';\n    input.classList.toggle('valid', ok);\n    (esDivisor ? b2 : b1).disabled = !ok;\n  });\n}\nfiltrar(a, m1, false);\nfiltrar(b, m2, true);\n\nb1.onclick = () => {\n  setStep(2);\n  b.disabled = false; a.disabled = true; b.focus();\n};\na.addEventListener('keydown', e => { if (e.key === 'Enter' && !b1.disabled) b1.click(); });\nb.addEventListener('keydown', e => { if (e.key === 'Enter' && !b2.disabled) b2.click(); });\n\nb2.onclick = async () => {\n  const A = parseInt(a.value, 10), B = parseInt(b.value, 10);\n  if (B === 0) return rechazar(b, m2, '🚫 No se puede dividir por cero'); // doble seguridad\n  b.disabled = true; b2.disabled = true;\n  setStep(3);\n  await dividirAnimado(A, B);\n};\n\n// Formato argentino; muy chico o muy grande -> notación científica (nunca muestra 0 si no es 0)\nfunction formatear(r) {\n  if (r === 0) return '0';\n  const abs = Math.abs(r);\n  if (abs < 0.000001 || abs >= 1e15) {\n    const [m, e] = r.toExponential(4).split('e');\n    const mant = parseFloat(m).toLocaleString('es-AR', { maximumFractionDigits: 4 });\n    return mant + ' × 10<sup>' + parseInt(e, 10) + '<\/sup>';\n  }\n  return r.toLocaleString('es-AR', { maximumFractionDigits: 6 });\n}\n\nasync function dividirAnimado(A, B) {\n  const res = $('res');\n  res.classList.remove('show');\n  const r = A / B;\n  const txt = formatear(r);\n  res.innerHTML = `${A} ÷ ${B} = <b class=\"q\">${txt}<\/b>`;\n  await sleep(50);\n  res.classList.add('show');\n}\n\n$('reset').onclick = () => {\n  [a, b].forEach(i => { i.value = ''; i.dataset.prev = ''; i.classList.remove('valid', 'error'); });\n  a.disabled = false; b.disabled = true; b1.disabled = true; b2.disabled = true;\n  m1.textContent = m2.textContent = '';\n  setStep(1); a.focus();\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": 2, "icono": "🏷️", "titulo": "Precio del producto", "regla": "El precio no puede ser negativo", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Precio del producto<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; }\n  .card { width:100%; max-width:520px; background:var(--card); border-radius:16px; padding:24px; box-shadow:0 10px 40px #0006; }\n  h1 { font-size:1.2rem; margin:0 0 16px; }\n  .step { opacity:.35; pointer-events:none; transition:opacity .5s, transform .5s; transform:translateY(8px); margin-bottom:16px; }\n  .step.active { opacity:1; pointer-events:auto; transform:none; }\n  .step.done { opacity:.7; transform:none; }\n  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }\n  input { width:100%; font-size:1.5rem; padding:10px 14px; border-radius:10px; border:2px solid #334155; background:#0f172a; color:var(--txt); outline:none; transition:border-color .2s; }\n  input:focus { border-color:var(--acc); }\n  input.error { border-color:var(--err); animation:shake .4s; }\n  input.valid { border-color:var(--ok); }\n  @keyframes shake { 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }\n  .msg { min-height:1.2em; font-size:.85rem; margin-top:6px; color:var(--mut); transition:color .2s; }\n  .msg.error { color:var(--err); }\n  button { width:100%; margin-top:10px; padding:12px; font-size:1rem; border:0; border-radius:10px; background:var(--acc); color:#0f172a; font-weight:700; cursor:pointer; transition:transform .1s, opacity .2s; }\n  button:active { transform:scale(.97); }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  .resultado { margin-top:4px; font-size:1.8rem; text-align:center; opacity:0; transform:scale(.9); transition:opacity .6s, transform .6s; }\n  .resultado.show { opacity:1; transform:none; }\n  .q { color:var(--ok); font-weight:700; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h1>🏷️ Ejemplo 2 · Precio del producto<\/h1>\n\n  <div class=\"step active\" id=\"s1\">\n    <label for=\"p\">Ingrese el precio del producto<\/label>\n    <input id=\"p\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Ej: 1599,90\">\n    <div class=\"msg\" id=\"m1\"><\/div>\n    <button id=\"b1\" disabled>Confirmar precio<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s2\">\n    <div class=\"resultado\" id=\"res\"><\/div>\n    <button id=\"reset\">Ingresar otro precio<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst p = $('p'), m1 = $('m1'), b1 = $('b1');\nconst MSG = 'El precio no puede ser negativo. Ingrese un número válido.';\nconst patron = /^\\d*([.,]\\d{0,2})?$/; // solo dígitos y hasta 2 decimales (sin signo \"-\")\nlet prev = '';\n\nfunction setStep(n) {\n  [1, 2].forEach(i => {\n    const s = $('s' + i);\n    s.classList.toggle('active', i === n);\n    s.classList.toggle('done', i < n);\n  });\n}\n\nfunction rechazar(texto) {\n  p.classList.remove('error'); void p.offsetWidth; // reinicia la animación\n  p.classList.add('error');\n  m1.textContent = '🚫 ' + texto; m1.className = 'msg error';\n  setTimeout(() => p.classList.remove('error'), 450);\n}\n\np.addEventListener('input', () => {\n  const v = p.value;\n  if (!patron.test(v)) {      // negativos (\"-\"), letras, símbolos, más de 2 decimales\n    p.value = prev;\n    return rechazar(MSG);\n  }\n  prev = v;\n  m1.textContent = ''; m1.className = 'msg';\n  const num = parseFloat(v.replace(',', '.'));\n  const ok = !isNaN(num);\n  p.classList.toggle('valid', ok);\n  b1.disabled = !ok;\n});\n\np.addEventListener('keydown', e => { if (e.key === 'Enter' && !b1.disabled) b1.click(); });\n\nb1.onclick = async () => {\n  const num = parseFloat(p.value.replace(',', '.'));\n  if (isNaN(num) || num < 0) return rechazar(MSG); // doble seguridad\n  p.disabled = true; b1.disabled = true;\n  setStep(2);\n  const res = $('res');\n  res.classList.remove('show');\n  res.innerHTML = `Precio: <span class=\"q\">${num.toLocaleString('es-AR', { style:'currency', currency:'ARS' })}<\/span>`;\n  await new Promise(r => setTimeout(r, 50));\n  res.classList.add('show');\n};\n\n$('reset').onclick = () => {\n  p.value = ''; prev = ''; p.disabled = false;\n  p.classList.remove('valid', 'error');\n  m1.textContent = ''; m1.className = 'msg';\n  b1.disabled = true;\n  setStep(1); p.focus();\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": 3, "icono": "📝", "titulo": "Nota del 1 al 10", "regla": "Solo notas enteras entre 1 y 10", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ejemplo 3 · Nota del 1 al 10<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; ; padding:0; border-radius:50%; background:var(--line); border:0; }\n  .dots button.on { background:var(--a); transform:scale(1.25); }\n  .pbox { display:none; align-items:center; gap:10px; color:var(--mut); }\n  .pbox.on { display:flex; }\n  .pbox input { flex:1; accent-color:var(--r); }\n  .pbox b { color:var(--r); min-width:3.2em; text-align:right; font-family:ui-monospace,Consolas,monospace; }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"lienzo\" id=\"caja\"><canvas id=\"cv\"><\/canvas><\/div>\n\n  <div class=\"panel\">\n    <h2 id=\"stitulo\"><\/h2>\n    <p id=\"stexto\"><\/p>\n    <div class=\"info\" id=\"sinfo\"><\/div>\n  <\/div>\n\n  <div class=\"pbox\" id=\"pbox\">\n    <span id=\"plabel\"><\/span>\n    <input type=\"range\" id=\"par\">\n    <b id=\"pval\"><\/b>\n  <\/div>\n\n  <div class=\"ctrl\">\n    <button id=\"ant\" aria-label=\"Escena anterior\">‹ Anterior<\/button>\n    <button id=\"play\">⏸ Pausar<\/button>\n    <button id=\"sig\" aria-label=\"Escena siguiente\">Siguiente ›<\/button>\n    <button id=\"reset\">↺ Reiniciar<\/button>\n    <div class=\"dots\" id=\"dots\"><\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst cv = $('cv'), ctx = cv.getContext('2d'), caja = $('caja');\nconst C = { a:'#60a5fa', b:'#34d399', r:'#fbbf24', err:'#f87171', txt:'#e2e8f0', mut:'#94a3b8', borde:'#334155' };\n\n/* ---------- Datos del ejemplo ---------- */\nconst V = [8, 6, 9, 7, 10];       // int notas[5]\nconst N0 = V.length, NUEVO = 5;\nconst BASE = 100, TAM = 4;         // dirección base y bytes por int\nconst dir = i => BASE + i * TAM;\n\n/* ---------- Estado ---------- */\nlet esc = 0, ts = 0, hold = 0, ultT = performance.now(), autoplay = true, pausado = false, tocado = false;\n// ts = ms transcurridos en la escena (se detiene en pausa) · hold = espera antes de pasar a la siguiente\nlet par = 0, parUser = false;\n\n/* ---------- Utilidades ---------- */\nconst clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));\nconst ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;\nconst plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);\n\nlet W = 0, H = 0, Z = 1;   // Z = factor de escala de textos y marcas según el tamaño de las celdas\nfunction resize() {\n  const r = caja.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;\n  W = r.width; H = r.height;\n  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n  cv.style.width = W + 'px'; cv.style.height = H + 'px';\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n}\nnew ResizeObserver(resize).observe(caja);\nwindow.addEventListener('resize', resize);\n\n/* ---------- Dibujo ---------- */\nfunction texto(s, x, y, col, size = 14, align = 'center', bold = true) {\n  ctx.save(); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';\n  ctx.font = (bold ? '700 ' : '400 ') + size + 'px system-ui, sans-serif';\n  ctx.fillText(String(s), x, y, W - 20); ctx.restore();\n}\n\n// Distribución de las celdas: \"slots\" es la cantidad de posiciones que deben entrar en pantalla\nfunction lay(slots, bajo = 140) {   // bajo = espacio reservado debajo de las celdas (escalado con Z)\n  const gap = 10;\n  const cs = Math.max(30, Math.min(124, (W - 32 - (slots - 1) * gap) / slots, H * .27));\n  Z = clamp(cs / 74, .85, 1.75);\n  const total = slots * cs + (slots - 1) * gap;\n  const arriba = 52 * Z, abajo = bajo * Z;              // espacio para el puntero y para índices + mensaje\n  const y = Math.max(arriba, (H - (arriba + cs + abajo)) / 2 + arriba);\n  return { cs, gap, step: cs + gap, x0: (W - total) / 2, total, y };\n}\nconst cx = (L, slot) => L.x0 + slot * L.step + L.cs / 2;\n\nfunction celda(L, slot, val, o = {}) {\n  const x = L.x0 + slot * L.step, y = L.y + (o.dy || 0);\n  ctx.save(); ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;\n  ctx.fillStyle = o.fill || '#0f172a'; ctx.strokeStyle = o.stroke || C.a; ctx.lineWidth = (o.lw || 2.5) * Math.max(1, Z * .8);\n  ctx.setLineDash(o.dash || []);\n  ctx.beginPath(); ctx.roundRect(x, y, L.cs, L.cs, 10 * Z); ctx.fill(); ctx.stroke();\n  ctx.setLineDash([]); ctx.restore();\n  if (val !== null && val !== undefined) {\n    ctx.save(); ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;\n    texto(val, x + L.cs / 2, y + L.cs / 2, o.txt || C.txt, Math.min(46, L.cs * .45)); ctx.restore();\n  }\n}\n\nfunction indices(L, desde, hasta, col, alpha = 1, conCaption = true) {\n  ctx.save(); ctx.globalAlpha = alpha;\n  for (let i = desde; i <= hasta; i++) texto(i, cx(L, i), L.y + L.cs + 20 * Z, col || C.mut, 15 * Z, 'center', false);\n  if (conCaption && L.x0 >= 70) texto('índice', L.x0 - 8, L.y + L.cs + 20 * Z, C.mut, 12 * Z, 'right', false);\n  ctx.restore();\n}\n\nfunction direcciones(L, n, alpha = 1) {\n  ctx.save(); ctx.globalAlpha = alpha;\n  for (let i = 0; i < n; i++) texto(dir(i), cx(L, i), L.y + L.cs + 46 * Z, C.mut, 12 * Z, 'center', false);\n  if (L.x0 >= 70) texto('dirección', L.x0 - 8, L.y + L.cs + 46 * Z, C.mut, 12 * Z, 'right', false);\n  ctx.restore();\n}\n\nfunction puntero(L, slot, etiqueta, col, dy = 0) {\n  const x = L.x0 + slot * L.step + L.cs / 2, y = L.y - 6 * Z + dy;\n  ctx.save(); ctx.fillStyle = col;\n  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10 * Z, y - 16 * Z); ctx.lineTo(x + 10 * Z, y - 16 * Z); ctx.closePath(); ctx.fill(); ctx.restore();\n  texto(etiqueta, x, y - 32 * Z, col, 15 * Z);\n}\n\nfunction mensaje(L, s, col) { texto(s, W / 2, L.y + L.cs + 94 * Z, col || C.r, 17 * Z); }\n\n/* ---------- Escenas ---------- */\nconst tinte = { a:'#0f2a4d', r:'#3a2f0b', b:'#0b3a2b', err:'#3a0b0b' };\n\n// --- 2 · acceso: posición del puntero según el tiempo (automático) o el deslizador (manual)\nfunction estadoAcceso(p) {\n  if (parUser) return { pos: par, idx: par };\n  const seq = [0, 2, 4, 5], seg = Math.min(3, Math.floor(p / .25)), loc = (p - seg * .25) / .25;\n  if (seg === 0) return { pos: 0, idx: 0 };\n  const q = ease(clamp(loc / .35));\n  return { pos: seq[seg - 1] + (seq[seg] - seq[seg - 1]) * q, idx: loc >= .35 ? seq[seg] : seq[seg - 1] };\n}\n\n// --- 4 · búsqueda\nfunction estadoBusqueda(p) {\n  const objetivo = par, hallado = V.indexOf(objetivo), pasos = hallado >= 0 ? hallado + 1 : N0;\n  const j = p < .08 ? -1 : Math.min(pasos - 1, Math.floor((p - .08) / .82 * pasos));\n  return { objetivo, hallado, pasos, j, fin: p >= .92 };\n}\n\n// --- 5 y 6 · desplazamientos\nfunction estadoInsertar(p) {\n  const pos = par, m = N0 - pos, sp = clamp((p - .05) / .7);\n  return { pos, m, sp, j: Math.min(Math.max(m - 1, 0), Math.floor(sp * m)) };\n}\nfunction estadoEliminar(p) {\n  const pos = par, m = N0 - 1 - pos, sp = clamp((p - .3) / .55);\n  return { pos, m, sp, j: Math.min(Math.max(m - 1, 0), Math.floor(sp * m)) };\n}\n\nconst ESCENAS = [\n  { // 1 · Qué es\n    titulo: '1 · ¿Qué es un vector?', dur: () => 4600,\n    texto: 'Un <b>vector<\/b> (o <b>arreglo<\/b>) guarda varios datos del <b>mismo tipo<\/b> en posiciones <b>consecutivas<\/b> de la memoria. Cada dato se identifica con su <b>índice<\/b>, que empieza en <b>0<\/b>.',\n    info: () => 'int notas[5] = {8, 6, 9, 7, 10};  <small>→ 5 elementos, índices de 0 a 4<\/small>',\n    dibujar(p) {\n      const L = lay(5, 70);\n      for (let i = 0; i < N0; i++) {\n        const t = clamp((p - .05 - i * .12) / .16);\n        if (t > 0) celda(L, i, V[i], { stroke: C.a, alpha: t, dy: -(1 - ease(t)) * 26 });\n      }\n      if (p > .62) indices(L, 0, N0 - 1, C.mut, clamp((p - .62) / .14));\n      if (p > .74) direcciones(L, N0, clamp((p - .74) / .14));\n      const ba = clamp((p - .88) / .1);\n      if (ba > 0) {\n        ctx.save(); ctx.globalAlpha = ba; ctx.strokeStyle = C.r; ctx.lineWidth = 2;\n        const y = L.y - 16 * Z;\n        ctx.beginPath(); ctx.moveTo(L.x0, y + 8 * Z); ctx.lineTo(L.x0, y); ctx.lineTo(L.x0 + L.total, y); ctx.lineTo(L.x0 + L.total, y + 8 * Z); ctx.stroke();\n        ctx.restore();\n        ctx.save(); ctx.globalAlpha = ba; texto('notas · n = 5 elementos · todos de tipo int', W / 2, L.y - 38 * Z, C.r, 16 * Z); ctx.restore();\n      }\n    }\n  },\n  { // 2 · Acceso por índice\n    titulo: '2 · Acceso por índice', dur: () => 9000,\n    param: { label: 'Índice', min: 0, max: 6, step: 1, def: 0, auto: true, fmt: v => 'i = ' + v },\n    texto: 'Para leer un elemento usás su índice: <b>notas[2]<\/b>. Los índices válidos van de <b>0<\/b> a <b>n − 1<\/b>. La dirección se calcula directo (base + índice × tamaño), por eso acceder es <b>inmediato<\/b>. Si te pasás del rango, hay error. Probá con el deslizador.',\n    info(p) {\n      const { idx } = estadoAcceso(p);\n      if (idx > N0 - 1) return `<span class=\"err\">notas[${idx}] → Índice fuera de rango. Ingrese un índice entre 0 y ${N0 - 1}<\/span>`;\n      return `notas[${idx}] = ${V[idx]}  <small>→ dirección = ${BASE} + ${idx} × ${TAM} = ${dir(idx)}<\/small>`;\n    },\n    dibujar(p) {\n      const L = lay(7), { pos, idx } = estadoAcceso(p), malo = idx > N0 - 1;\n      for (let i = N0; i < 7; i++) celda(L, i, null, { stroke: C.borde, dash: [5, 5], alpha: .55, lw: 2 });\n      for (let i = 0; i < N0; i++) {\n        const sel = !malo && i === idx;\n        celda(L, i, V[i], { stroke: sel ? C.r : C.a, fill: sel ? tinte.r : undefined });\n      }\n      indices(L, 0, N0 - 1, C.mut);\n      ctx.save(); ctx.globalAlpha = .6; for (let i = N0; i < 7; i++) texto(i, cx(L, i), L.y + L.cs + 20 * Z, C.err, 15 * Z, 'center', false); ctx.restore();\n      direcciones(L, N0, .9);\n      puntero(L, pos, 'notas[' + idx + ']', malo ? C.err : C.r);\n      if (malo) mensaje(L, '✕ Fuera del vector: no hay nada reservado acá', C.err);\n      else mensaje(L, 'notas[' + idx + '] vale ' + V[idx], C.r);\n    }\n  },\n  { // 3 · Recorrer\n    titulo: '3 · Recorrer el vector', dur: () => 7000,\n    texto: 'Recorrer es visitar cada posición, de la primera a la última, con un ciclo <b>for<\/b>. Acá vamos acumulando una suma para calcular el <b>promedio<\/b>.',\n    info(p) {\n      const prog = clamp((p - .08) / .8), i = Math.min(N0 - 1, Math.floor(prog * N0));\n      const suma = V.slice(0, i + 1).reduce((a, b) => a + b, 0);\n      const fin = prog >= 1;\n      return 'for (i = 0; i &lt; n; i++) suma += notas[i];<br>' +\n             `<small>i = ${i}<\/small> · suma = ${suma}` + (fin ? ` · promedio = ${suma} / ${N0} = ${suma / N0}` : '');\n    },\n    dibujar(p) {\n      const L = lay(5), prog = clamp((p - .08) / .8), i = Math.min(N0 - 1, Math.floor(prog * N0)), fin = prog >= 1;\n      for (let k = 0; k < N0; k++) {\n        const visto = fin || k < i, actual = !fin && k === i;\n        celda(L, k, V[k], { stroke: actual ? C.r : visto ? C.b : C.a, fill: actual ? tinte.r : visto ? tinte.b : undefined });\n      }\n      indices(L, 0, N0 - 1, C.mut);\n      if (!fin) puntero(L, i, 'i = ' + i, C.r);\n      const partes = V.slice(0, i + 1), suma = partes.reduce((a, b) => a + b, 0);\n      texto('suma = ' + partes.join(' + ') + ' = ' + suma, W / 2, L.y + L.cs + 88 * Z, C.r, 19 * Z);\n      if (fin) texto('promedio = ' + suma + ' / ' + N0 + ' = ' + (suma / N0), W / 2, L.y + L.cs + 122 * Z, C.b, 19 * Z);\n    }\n  },\n  { // 4 · Búsqueda secuencial\n    titulo: '4 · Búsqueda secuencial', dur: () => 1600 + estadoBusqueda(0).pasos * 900,\n    param: { label: 'Buscar el valor', min: 1, max: 10, step: 1, def: 9, auto: false, fmt: v => String(v) },\n    texto: 'La <b>búsqueda secuencial<\/b> compara el valor buscado con cada elemento, uno por uno, hasta encontrarlo o llegar al final. Elegí qué valor buscar: el <b>5<\/b> no está en el vector.',\n    info(p) {\n      const e = estadoBusqueda(p);\n      const res = !e.fin ? 'comparando…' : e.hallado >= 0 ? 'índice ' + e.hallado : '-1 (no está)';\n      return `buscar(notas, ${e.objetivo}) → ${res}<br><small>comparaciones: ${e.fin ? e.pasos : Math.max(0, e.j + 1)}<\/small>`;\n    },\n    dibujar(p) {\n      const L = lay(5), e = estadoBusqueda(p);\n      for (let k = 0; k < N0; k++) {\n        let o = { stroke: C.a };\n        if (e.fin) o = (k === e.hallado) ? { stroke: C.b, fill: tinte.b } : { stroke: C.borde, alpha: .55 };\n        else if (k === e.j) o = { stroke: C.r, fill: tinte.r };\n        else if (k < e.j) o = { stroke: C.borde, alpha: .6 };\n        celda(L, k, V[k], o);\n        if (!e.fin && k < e.j) texto('≠', cx(L, k), L.y - 14 * Z, C.mut, 19 * Z);\n      }\n      indices(L, 0, N0 - 1, C.mut);\n      if (!e.fin && e.j >= 0) puntero(L, e.j, 'i = ' + e.j, C.r);\n      if (e.fin) {\n        if (e.hallado >= 0) mensaje(L, '¡Encontrado en el índice ' + e.hallado + '! (' + plural(e.pasos, 'comparación', 'comparaciones') + ')', C.b);\n        else mensaje(L, 'No está en el vector (' + N0 + ' comparaciones)', C.err);\n      } else if (e.j >= 0) {\n        const v = V[e.j];\n        mensaje(L, 'notas[' + e.j + '] = ' + v + (v === e.objetivo ? ' = ' : ' ≠ ') + e.objetivo, C.r);\n      } else mensaje(L, 'Busco el ' + e.objetivo + '…', C.mut);\n    }\n  },\n  { // 5 · Insertar\n    titulo: '5 · Insertar un elemento', dur: () => 7500,\n    param: { label: 'Posición', min: 0, max: 5, step: 1, def: 2, auto: false, fmt: v => 'pos ' + v },\n    texto: 'Para <b>insertar<\/b> en el medio hay que correr los elementos hacia la derecha y dejar un hueco. Cuanto más al principio, <b>más elementos hay que mover<\/b>. Elegí la posición.',\n    info(p) {\n      const { pos } = estadoInsertar(p);\n      return `insertar(notas, pos = ${pos}, valor = ${NUEVO})<br><small>n = ${p > .78 ? N0 + 1 : N0}<\/small>`;\n    },\n    dibujar(p) {\n      const L = lay(6), { pos, m, sp } = estadoInsertar(p);\n      celda(L, 5, null, { stroke: C.borde, dash: [5, 5], alpha: .8, lw: 2 });\n      if (p > .7) celda(L, pos, null, { stroke: C.r, dash: [5, 5], alpha: clamp((p - .7) / .08) });\n      for (let i = 0; i < N0; i++) {\n        let slot = i, mov = false;\n        if (i >= pos) { const q = clamp(sp * m - (N0 - 1 - i)); slot = i + ease(q); mov = q > 0 && q < 1; }\n        celda(L, slot, V[i], { stroke: mov ? C.r : C.a, fill: mov ? tinte.r : undefined });\n      }\n      const t = clamp((p - .78) / .18);\n      if (t > 0) celda(L, pos, NUEVO, { stroke: C.b, fill: tinte.b, alpha: t, dy: -(1 - ease(t)) * 50 });\n      indices(L, 0, 5, C.mut);\n      let msg, col = C.r;\n      if (p < .05) msg = 'Quiero insertar el ' + NUEVO + ' en la posición ' + pos;\n      else if (sp < 1 && m > 0) { const i = N0 - 1 - estadoInsertar(p).j; msg = 'Desplazo notas[' + i + '] → notas[' + (i + 1) + ']'; }\n      else if (p < .78) msg = m > 0 ? 'Quedó el hueco libre' : 'La posición ya está libre';\n      else if (p < .97) { msg = 'Coloco el ' + NUEVO + ' en notas[' + pos + ']'; col = C.b; }\n      else { msg = m > 0 ? plural(m, 'desplazamiento', 'desplazamientos') + ' → el costo crece con n (O(n))' : 'No hubo que desplazar nada: se agregó al final'; col = C.b; }\n      mensaje(L, msg, col);\n    }\n  },\n  { // 6 · Eliminar\n    titulo: '6 · Eliminar un elemento', dur: () => 7500,\n    param: { label: 'Posición', min: 0, max: 4, step: 1, def: 1, auto: false, fmt: v => 'pos ' + v },\n    texto: 'Para <b>eliminar<\/b>, los elementos que siguen se corren hacia la izquierda para tapar el hueco. Al final el vector tiene <b>un elemento menos<\/b>. Elegí qué posición eliminar.',\n    info(p) {\n      const { pos } = estadoEliminar(p);\n      return `eliminar(notas, pos = ${pos})<br><small>n = ${p > .9 ? N0 - 1 : N0}<\/small>`;\n    },\n    dibujar(p) {\n      const L = lay(5), { pos, m, sp } = estadoEliminar(p), r = clamp((p - .05) / .2);\n      if (p > .25) celda(L, pos, null, { stroke: C.r, dash: [5, 5], alpha: .8 });\n      if (p > .3) celda(L, N0 - 1, null, { stroke: C.borde, dash: [5, 5], alpha: .8, lw: 2 });\n      for (let i = 0; i < N0; i++) {\n        if (i === pos) { if (r < 1) celda(L, i, V[i], { stroke: C.err, fill: tinte.err, alpha: 1 - r, dy: -r * 34 }); continue; }\n        let slot = i, mov = false;\n        if (i > pos) { const q = clamp(sp * m - (i - pos - 1)); slot = i - ease(q); mov = q > 0 && q < 1; }\n        celda(L, slot, V[i], { stroke: mov ? C.r : C.a, fill: mov ? tinte.r : undefined });\n      }\n      indices(L, 0, N0 - 1, C.mut);\n      let msg, col = C.r;\n      if (p < .05) msg = 'Quiero eliminar notas[' + pos + ']';\n      else if (p < .3) { msg = 'Elimino notas[' + pos + '] = ' + V[pos]; col = C.err; }\n      else if (sp < 1 && m > 0) { const i = pos + 1 + estadoEliminar(p).j; msg = 'Desplazo notas[' + i + '] → notas[' + (i - 1) + ']'; }\n      else if (p < .9) msg = m > 0 ? 'El hueco quedó tapado' : 'Era el último: no hay nada que desplazar';\n      else { msg = m > 0 ? plural(m, 'desplazamiento', 'desplazamientos') + ' → el costo crece con n (O(n))' : 'Eliminar el último elemento no mueve nada (O(1))'; col = C.b; }\n      mensaje(L, msg, col);\n    }\n  },\n  { // 7 · Resumen\n    titulo: '7 · Resumen de costos', dur: () => 5200,\n    texto: '<b>Acceder<\/b> por índice cuesta lo mismo sin importar el tamaño. En cambio <b>recorrer, buscar, insertar y eliminar<\/b> crecen a medida que el vector tiene más elementos (n).',\n    info: () => 'acceso: O(1)  ·  recorrer / buscar / insertar / eliminar: O(n)',\n    dibujar(p) {\n      const filas = [['Acceder  v[i]', 'O(1)', .08], ['Recorrer', 'O(n)', .85], ['Buscar', 'O(n)', .85], ['Insertar', 'O(n)', .85], ['Eliminar', 'O(n)', .85]];\n      const gap = Math.min(86, (H - 40) / 5.2), y0 = H / 2 - gap * 2, zs = clamp(gap / 54, .85, 1.55);\n      const bx = Math.min(190 * zs, W * .32), bw = Math.max(40, W - bx - 82 * zs);\n      filas.forEach(([nombre, costo, frac], k) => {\n        const y = y0 + k * gap, t = ease(clamp((p - k * .13) / .25)), largo = Math.max(6, bw * frac * t);\n        ctx.save(); ctx.globalAlpha = clamp(t * 3);\n        texto(nombre, 14, y, C.txt, 15 * zs, 'left');\n        const col = frac < .5 ? C.b : C.r;\n        ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(bx, y - 11 * zs, largo, 22 * zs, 11 * zs); ctx.fill();\n        texto(costo, bx + largo + 12, y, col, 17 * zs, 'left');\n        ctx.restore();\n      });\n    }\n  }\n];\nconst N = ESCENAS.length;\nconst durDe = s => s.dur();\n\n/* ---------- Interfaz ---------- */\nconst dots = $('dots');\nESCENAS.forEach((_, i) => {\n  const b = document.createElement('button');\n  b.setAttribute('aria-label', 'Ir a la escena ' + (i + 1));\n  b.onclick = () => { autoplay = false; irA(i); };\n  dots.appendChild(b);\n});\n\nlet ultInfo = '';\nfunction actualizarUI_play() { $('play').textContent = pausado ? '▶ Continuar' : '⏸ Pausar'; }\nfunction actualizarUI() {\n  const s = ESCENAS[esc];\n  $('stitulo').textContent = s.titulo;\n  $('stexto').innerHTML = s.texto;\n  const pr = s.param;\n  $('pbox').classList.toggle('on', !!pr);\n  if (pr) {\n    $('plabel').textContent = pr.label;\n    const inp = $('par'); inp.min = pr.min; inp.max = pr.max; inp.step = pr.step; inp.value = par;\n    $('pval').textContent = pr.fmt(par);\n  }\n  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === esc));\n  $('play').textContent = pausado ? '▶ Continuar' : '⏸ Pausar';\n  ultInfo = '';\n}\n\nfunction irA(i) {\n  esc = (i + N) % N; ts = 0; hold = 0; tocado = false; parUser = false; pausado = false;\n  const pr = ESCENAS[esc].param; par = pr ? pr.def : 0;\n  actualizarUI();\n}\n\n$('ant').onclick = () => { autoplay = false; irA(esc - 1); };\n$('sig').onclick = () => { autoplay = false; irA(esc + 1); };\n$('play').onclick = () => { pausado = !pausado; actualizarUI(); };\n$('reset').onclick = () => { autoplay = true; irA(esc); };\n\n$('par').oninput = e => {\n  const pr = ESCENAS[esc].param;\n  par = parseFloat(e.target.value); parUser = true; autoplay = false; hold = 0; pausado = false;\n  if (pr.auto) tocado = true;            // el acceso muestra el resultado al instante\n  else { tocado = false; ts = 0; }   // el resto reinicia la animación con el nuevo valor\n  $('pval').textContent = pr.fmt(par);\n  actualizarUI_play();\n};\n\n/* ---------- Bucle ---------- */\nfunction bucle(now) {\n  const dt = Math.min(100, now - ultT); ultT = now;   // tope: evita saltos al volver de otra pestaña\n  const s = ESCENAS[esc], dur = durDe(s);\n  if (!pausado) ts += dt;\n  const p = tocado ? 1 : clamp(ts / dur);\n  if (!pausado && autoplay && p >= 1) {\n    hold += dt;\n    if (hold > 3200) irA(esc + 1);\n  }\n  ctx.clearRect(0, 0, W, H);\n  s.dibujar(p);\n  if (pausado) {\n    ctx.save(); ctx.fillStyle = 'rgba(15,23,42,.88)';\n    ctx.beginPath(); ctx.roundRect(W - 108, 12, 96, 28, 14); ctx.fill(); ctx.restore();\n    texto('⏸ En pausa', W - 60, 26, C.r, 13);\n  }\n  const info = s.info(p);\n  if (info !== ultInfo) { $('sinfo').innerHTML = info; ultInfo = info; }\n  if (s.param && s.param.auto && !parUser) {   // en modo automático el deslizador acompaña a la animación\n    const v = Math.round(estadoAcceso(p).idx);\n    if ($('par').value !== String(v)) { $('par').value = v; $('pval').textContent = s.param.fmt(v); }\n  }\n  requestAnimationFrame(bucle);\n}\n\n// Atajos: barra espaciadora o toque sobre el dibujo = pausar / continuar\ncv.addEventListener('click', () => $('play').click());\ndocument.addEventListener('keydown', e => {\n  if (e.code === 'Space' && !['BUTTON', 'INPUT'].includes(e.target.tagName)) { e.preventDefault(); $('play').click(); }\n});\n\nresize();\nirA(0);\nrequestAnimationFrame(bucle);\n<\/script>\n<\/body>\n<\/html>\n";

const $ = id => document.getElementById(id);
let actual = 0;

// Portada: tarjetas
EJEMPLOS.forEach((e, i) => {
  const b = document.createElement('button');
  b.className = 'tarjeta';
  b.style.animationDelay = (i * 70) + 'ms';
  b.innerHTML = '<span class="num">Ejemplo ' + e.n + '</span><span class="ico">' + e.icono + '</span>' +
                '<h2></h2><span class="regla"></span>';
  b.querySelector('h2').textContent = e.titulo;
  b.querySelector('.regla').textContent = e.regla;
  b.onclick = () => abrir(i);
  $('grid').appendChild(b);
});

function mostrar(id) {
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === id));
  $('tab-ej').classList.toggle('on', id !== 'vectores');
  $('tab-vec').classList.toggle('on', id === 'vectores');
}

let ultimaEj = 'portada'; // a qué pantalla volver al regresar a la solapa Ejemplos

function irEjemplos() {
  $('marcoVec').srcdoc = '';
  if (ultimaEj === 'viewer') abrir(actual); else mostrar('portada');
  if (ultimaEj !== 'viewer') { try { history.replaceState(null, '', location.pathname); } catch (_) {} }
}

function irVectores() {
  $('marco').srcdoc = '';
  $('marcoVec').srcdoc = VECTORES; // se recarga: la animación arranca desde el principio
  mostrar('vectores');
  try { history.replaceState(null, '', '#vectores'); } catch (_) {}
}

$('tab-ej').onclick = irEjemplos;
$('tab-vec').onclick = irVectores;

function abrir(i) {
  actual = i;
  const e = EJEMPLOS[i];
  $('marco').srcdoc = e.html;
  $('titulo').textContent = 'Ejemplo ' + e.n + ' · ' + e.titulo;
  $('ant').disabled = i === 0;
  $('sig').disabled = i === EJEMPLOS.length - 1;
  mostrar('viewer');
  ultimaEj = 'viewer';
  try { history.replaceState(null, '', '#ejemplo-' + e.n); } catch (_) {}
}

$('volver').onclick = () => {
  $('marco').srcdoc = '';
  ultimaEj = 'portada';
  mostrar('portada');
  try { history.replaceState(null, '', location.pathname); } catch (_) {}
};
$('ant').onclick = () => { if (actual > 0) abrir(actual - 1); };
$('sig').onclick = () => { if (actual < EJEMPLOS.length - 1) abrir(actual + 1); };

// PWA: registra el service worker (requiere https o localhost)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Abre directo si la URL trae #ejemplo-N o #vectores
const m = /^#ejemplo-(\d+)$/.exec(location.hash);
if (m && EJEMPLOS[m[1] - 1]) abrir(m[1] - 1);
else if (location.hash === '#vectores') irVectores();
</script>
</body>
</html>
