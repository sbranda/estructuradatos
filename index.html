<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejemplos de validación</title>
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Seis ejemplos animados de validación de datos.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Validaciones">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --acc:#60a5fa; --line:#334155; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; }
  .vista { display:none; min-height:100%; }
  .vista.activa { display:block; }
  #viewer.activa { display:flex; flex-direction:column; height:100%; }

  /* Portada */
  header.portada { text-align:center; padding:40px 16px 8px; }
  header.portada h1 { margin:0 0 8px; font-size:1.7rem; }
  header.portada p { margin:0; color:var(--mut); }
  .grid { max-width:920px; margin:24px auto 40px; padding:0 16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
  .tarjeta { text-align:left; font:inherit; color:inherit; background:var(--card); border:2px solid transparent; border-radius:16px; padding:20px; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:transform .2s, border-color .2s, box-shadow .2s; opacity:0; animation:entra .5s forwards; }
  .tarjeta:hover, .tarjeta:focus-visible { transform:translateY(-4px); border-color:var(--acc); box-shadow:0 10px 30px #0006; outline:none; }
  .tarjeta .num { font-size:.8rem; color:var(--acc); font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  .tarjeta .ico { font-size:2rem; }
  .tarjeta h2 { margin:0; font-size:1.1rem; }
  .tarjeta .regla { font-size:.9rem; color:var(--mut); }
  .tarjeta .regla b { color:var(--ok); font-weight:600; }
  @keyframes entra { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* Visor */
  .barra { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .barra button { font:inherit; color:var(--txt); background:#0f172a; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; transition:border-color .2s, opacity .2s; }
  .barra button:hover:not(:disabled) { border-color:var(--acc); }
  .barra button:disabled { opacity:.35; cursor:not-allowed; }
  .barra .titulo { flex:1; text-align:center; font-weight:700; min-width:140px; }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
</style>
</head>
<body>

<section class="vista activa" id="portada">
  <header class="portada">
    <h1>Ejemplos de validación</h1>
    <p>Elegí un ejemplo para probarlo</p>
  </header>
  <div class="grid" id="grid"></div>
</section>

<section class="vista" id="viewer">
  <div class="barra">
    <button id="volver">← Ejemplos</button>
    <button id="ant">‹ Anterior</button>
    <div class="titulo" id="titulo"></div>
    <button id="sig">Siguiente ›</button>
  </div>
  <iframe id="marco" title="Ejemplo"></iframe>
</section>

<script>
const EJEMPLOS = [{"n": 1, "icono": "➗", "titulo": "División por 0", "regla": "El segundo número no acepta 0", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ejemplo 1 · División por 0<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; }\n  .card { width:100%; max-width:520px; background:var(--card); border-radius:16px; padding:24px; box-shadow:0 10px 40px #0006; }\n  h1 { font-size:1.2rem; margin:0 0 16px; }\n  .step { opacity:.35; pointer-events:none; transition:opacity .5s, transform .5s; transform:translateY(8px); margin-bottom:16px; }\n  .step.active { opacity:1; pointer-events:auto; transform:none; }\n  .step.done { opacity:.7; transform:none; }\n  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }\n  input { width:100%; font-size:1.5rem; padding:10px 14px; border-radius:10px; border:2px solid #334155; background:#0f172a; color:var(--txt); outline:none; transition:border-color .2s; }\n  input:focus { border-color:var(--acc); }\n  input.error { border-color:var(--err); animation:shake .4s; }\n  input.valid { border-color:var(--ok); }\n  @keyframes shake { 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }\n  .msg { min-height:1.2em; font-size:.85rem; margin-top:6px; color:var(--mut); transition:color .2s; }\n  .msg.error { color:var(--err); }\n  button { width:100%; margin-top:10px; padding:12px; font-size:1rem; border:0; border-radius:10px; background:var(--acc); color:#0f172a; font-weight:700; cursor:pointer; transition:transform .1s, opacity .2s; }\n  button:active { transform:scale(.97); }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  #pizarra { font-family:ui-monospace,Consolas,monospace; font-size:1.3rem; line-height:1.6; background:#0f172a; border-radius:10px; padding:16px; min-height:140px; overflow-x:auto; white-space:pre; }\n  .linea { opacity:0; transform:translateY(-6px); animation:aparece .5s forwards; }\n  @keyframes aparece { to { opacity:1; transform:none; } }\n  .q { color:var(--ok); font-weight:700; }\n  .r { color:var(--acc); }\n  .resultado { margin-top:4px; font-size:1.8rem; text-align:center; opacity:0; transition:opacity .6s; }\n  .resultado.show { opacity:1; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h1>➗ Ejemplo 1 · División por 0<\/h1>\n\n  <div class=\"step active\" id=\"s1\">\n    <label for=\"a\">Ingrese el primer número<\/label>\n    <input id=\"a\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"Ej: 1234\">\n    <div class=\"msg\" id=\"m1\"><\/div>\n    <button id=\"b1\" disabled>Continuar<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s2\">\n    <label for=\"b\">Ingrese el segundo número<\/label>\n    <input id=\"b\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"Ej: 7\" disabled>\n    <div class=\"msg\" id=\"m2\"><\/div>\n    <button id=\"b2\" disabled>Dividir<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s3\">\n    <div class=\"resultado\" id=\"res\"><\/div>\n    <button id=\"reset\">Nueva división<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst a = $('a'), b = $('b'), m1 = $('m1'), m2 = $('m2');\nconst b1 = $('b1'), b2 = $('b2');\nconst patron = /^-?\\d*$/;\n\nfunction setStep(n) {\n  [1, 2, 3].forEach(i => {\n    const s = $('s' + i);\n    s.classList.toggle('active', i === n);\n    s.classList.toggle('done', i < n);\n  });\n}\n\nfunction rechazar(input, msg, texto) {\n  input.classList.remove('error'); void input.offsetWidth; // reinicia animación\n  input.classList.add('error');\n  msg.textContent = texto; msg.className = 'msg error';\n  setTimeout(() => input.classList.remove('error'), 450);\n}\n\n// Filtra caracteres inválidos y, en el divisor, impide que el valor sea 0\nfunction filtrar(input, msg, esDivisor) {\n  let prev = input.dataset.prev || '';\n  input.addEventListener('input', () => {\n    let v = input.value;\n    if (!patron.test(v)) {\n      input.value = prev;\n      return rechazar(input, msg, 'Solo se permiten números enteros.');\n    }\n    if (esDivisor && v !== '' && v !== '-' && Number(v) === 0) {\n      input.value = prev === '0' ? '' : prev;\n      prev = input.value;\n      b2.disabled = true;\n      return rechazar(input, msg, '🚫 No se puede dividir por cero');\n    }\n    prev = v; input.dataset.prev = v;\n    msg.textContent = ''; msg.className = 'msg';\n    const ok = v !== '' && v !== '-';\n    input.classList.toggle('valid', ok);\n    (esDivisor ? b2 : b1).disabled = !ok;\n  });\n}\nfiltrar(a, m1, false);\nfiltrar(b, m2, true);\n\nb1.onclick = () => {\n  setStep(2);\n  b.disabled = false; a.disabled = true; b.focus();\n};\na.addEventListener('keydown', e => { if (e.key === 'Enter' && !b1.disabled) b1.click(); });\nb.addEventListener('keydown', e => { if (e.key === 'Enter' && !b2.disabled) b2.click(); });\n\nb2.onclick = async () => {\n  const A = parseInt(a.value, 10), B = parseInt(b.value, 10);\n  if (B === 0) return rechazar(b, m2, '🚫 No se puede dividir por cero'); // doble seguridad\n  b.disabled = true; b2.disabled = true;\n  setStep(3);\n  await dividirAnimado(A, B);\n};\n\n// Formato argentino; muy chico o muy grande -> notación científica (nunca muestra 0 si no es 0)\nfunction formatear(r) {\n  if (r === 0) return '0';\n  const abs = Math.abs(r);\n  if (abs < 0.000001 || abs >= 1e15) {\n    const [m, e] = r.toExponential(4).split('e');\n    const mant = parseFloat(m).toLocaleString('es-AR', { maximumFractionDigits: 4 });\n    return mant + ' × 10<sup>' + parseInt(e, 10) + '<\/sup>';\n  }\n  return r.toLocaleString('es-AR', { maximumFractionDigits: 6 });\n}\n\nasync function dividirAnimado(A, B) {\n  const res = $('res');\n  res.classList.remove('show');\n  const r = A / B;\n  const txt = formatear(r);\n  res.innerHTML = `${A} ÷ ${B} = <b class=\"q\">${txt}<\/b>`;\n  await sleep(50);\n  res.classList.add('show');\n}\n\n$('reset').onclick = () => {\n  [a, b].forEach(i => { i.value = ''; i.dataset.prev = ''; i.classList.remove('valid', 'error'); });\n  a.disabled = false; b.disabled = true; b1.disabled = true; b2.disabled = true;\n  m1.textContent = m2.textContent = '';\n  setStep(1); a.focus();\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": 2, "icono": "🏷️", "titulo": "Precio del producto", "regla": "El precio no puede ser negativo", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Precio del producto<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; }\n  .card { width:100%; max-width:520px; background:var(--card); border-radius:16px; padding:24px; box-shadow:0 10px 40px #0006; }\n  h1 { font-size:1.2rem; margin:0 0 16px; }\n  .step { opacity:.35; pointer-events:none; transition:opacity .5s, transform .5s; transform:translateY(8px); margin-bottom:16px; }\n  .step.active { opacity:1; pointer-events:auto; transform:none; }\n  .step.done { opacity:.7; transform:none; }\n  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }\n  input { width:100%; font-size:1.5rem; padding:10px 14px; border-radius:10px; border:2px solid #334155; background:#0f172a; color:var(--txt); outline:none; transition:border-color .2s; }\n  input:focus { border-color:var(--acc); }\n  input.error { border-color:var(--err); animation:shake .4s; }\n  input.valid { border-color:var(--ok); }\n  @keyframes shake { 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }\n  .msg { min-height:1.2em; font-size:.85rem; margin-top:6px; color:var(--mut); transition:color .2s; }\n  .msg.error { color:var(--err); }\n  button { width:100%; margin-top:10px; padding:12px; font-size:1rem; border:0; border-radius:10px; background:var(--acc); color:#0f172a; font-weight:700; cursor:pointer; transition:transform .1s, opacity .2s; }\n  button:active { transform:scale(.97); }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  .resultado { margin-top:4px; font-size:1.8rem; text-align:center; opacity:0; transform:scale(.9); transition:opacity .6s, transform .6s; }\n  .resultado.show { opacity:1; transform:none; }\n  .q { color:var(--ok); font-weight:700; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h1>🏷️ Ejemplo 2 · Precio del producto<\/h1>\n\n  <div class=\"step active\" id=\"s1\">\n    <label for=\"p\">Ingrese el precio del producto<\/label>\n    <input id=\"p\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Ej: 1599,90\">\n    <div class=\"msg\" id=\"m1\"><\/div>\n    <button id=\"b1\" disabled>Confirmar precio<\/button>\n  <\/div>\n\n  <div class=\"step\" id=\"s2\">\n    <div class=\"resultado\" id=\"res\"><\/div>\n    <button id=\"reset\">Ingresar otro precio<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst p = $('p'), m1 = $('m1'), b1 = $('b1');\nconst MSG = 'El precio no puede ser negativo. Ingrese un número válido.';\nconst patron = /^\\d*([.,]\\d{0,2})?$/; // solo dígitos y hasta 2 decimales (sin signo \"-\")\nlet prev = '';\n\nfunction setStep(n) {\n  [1, 2].forEach(i => {\n    const s = $('s' + i);\n    s.classList.toggle('active', i === n);\n    s.classList.toggle('done', i < n);\n  });\n}\n\nfunction rechazar(texto) {\n  p.classList.remove('error'); void p.offsetWidth; // reinicia la animación\n  p.classList.add('error');\n  m1.textContent = '🚫 ' + texto; m1.className = 'msg error';\n  setTimeout(() => p.classList.remove('error'), 450);\n}\n\np.addEventListener('input', () => {\n  const v = p.value;\n  if (!patron.test(v)) {      // negativos (\"-\"), letras, símbolos, más de 2 decimales\n    p.value = prev;\n    return rechazar(MSG);\n  }\n  prev = v;\n  m1.textContent = ''; m1.className = 'msg';\n  const num = parseFloat(v.replace(',', '.'));\n  const ok = !isNaN(num);\n  p.classList.toggle('valid', ok);\n  b1.disabled = !ok;\n});\n\np.addEventListener('keydown', e => { if (e.key === 'Enter' && !b1.disabled) b1.click(); });\n\nb1.onclick = async () => {\n  const num = parseFloat(p.value.replace(',', '.'));\n  if (isNaN(num) || num < 0) return rechazar(MSG); // doble seguridad\n  p.disabled = true; b1.disabled = true;\n  setStep(2);\n  const res = $('res');\n  res.classList.remove('show');\n  res.innerHTML = `Precio: <span class=\"q\">${num.toLocaleString('es-AR', { style:'currency', currency:'ARS' })}<\/span>`;\n  await new Promise(r => setTimeout(r, 50));\n  res.classList.add('show');\n};\n\n$('reset').onclick = () => {\n  p.value = ''; prev = ''; p.disabled = false;\n  p.classList.remove('valid', 'error');\n  m1.textContent = ''; m1.className = 'msg';\n  b1.disabled = true;\n  setStep(1); p.focus();\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": 3, "icono": "📝", "titulo": "Nota del 1 al 10", "regla": "Solo notas enteras entre 1 y 10", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ejemplo 3 · Nota del 1 al 10<\/title>\n<style>\n  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#34d399; --err:#f87171; --acc:#60a5fa; }\n  * { box-sizing: border-box; }\n  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; const $ = id => document.getElementById(id);
let actual = 0;

// Portada: tarjetas
EJEMPLOS.forEach((e, i) => {
  const b = document.createElement('button');
  b.className = 'tarjeta';
  b.style.animationDelay = (i * 70) + 'ms';
  b.innerHTML = '<span class="num">Ejemplo ' + e.n + '</span><span class="ico">' + e.icono + '</span>' +
                '<h2></h2><span class="regla"></span>';
  b.querySelector('h2').textContent = e.titulo;
  b.querySelector('.regla').textContent = e.regla;
  b.onclick = () => abrir(i);
  $('grid').appendChild(b);
});

function mostrar(id) {
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === id));
}

function abrir(i) {
  actual = i;
  const e = EJEMPLOS[i];
  $('marco').srcdoc = e.html;
  $('titulo').textContent = 'Ejemplo ' + e.n + ' · ' + e.titulo;
  $('ant').disabled = i === 0;
  $('sig').disabled = i === EJEMPLOS.length - 1;
  mostrar('viewer');
  try { history.replaceState(null, '', '#ejemplo-' + e.n); } catch (_) {}
}

$('volver').onclick = () => {
  $('marco').srcdoc = '';
  mostrar('portada');
  try { history.replaceState(null, '', location.pathname); } catch (_) {}
};
$('ant').onclick = () => { if (actual > 0) abrir(actual - 1); };
$('sig').onclick = () => { if (actual < EJEMPLOS.length - 1) abrir(actual + 1); };

// PWA: registra el service worker (requiere https o localhost)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Abre directo si la URL trae #ejemplo-N
const m = /^#ejemplo-(\d+)$/.exec(location.hash);
if (m && EJEMPLOS[m[1] - 1]) abrir(m[1] - 1);
